<html lang="en-AU">
<head>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --serif: 'Playfair Display', Georgia, serif;
  --sans: 'DM Sans', system-ui, sans-serif;

  --bg:       #0a0a0a;
  --bg2:      #111;
  --bg3:      #161616;
  --bg4:      #1c1c1c;
  --card:     #131313;
  --card-hi:  #181818;

  --white:    #f8f6f0;
  --muted:    rgba(248,246,240,0.62);
  --dim:      rgba(248,246,240,0.42);
  --faint:    rgba(248,246,240,0.22);

  --accent:   #c8a96e;
  --accent-2: #d4b887;
  --accent-dim: rgba(200,169,110,0.5);
  --accent-bg: rgba(200,169,110,0.06);
  --accent-bg-strong: rgba(200,169,110,0.12);
  --accent-line: rgba(200,169,110,0.18);

  --border:   rgba(255,255,255,0.06);
  --border-2: rgba(255,255,255,0.1);
  --border-strong: rgba(255,255,255,0.18);

  --success:  #6db58a;
  --success-bg: rgba(109,181,138,0.1);
  --warning:  #d4a04a;
  --warning-bg: rgba(212,160,74,0.1);
  --danger:   #d97757;
  --danger-bg: rgba(217,119,87,0.1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--white);
  line-height: 1.6;
  font-weight: 300;
  min-height: 100vh;
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -20%, rgba(200,169,110,0.06), transparent),
    radial-gradient(ellipse 60% 40% at 80% 80%, rgba(200,169,110,0.03), transparent);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

.shell {
  max-width: 760px;
  margin: 0 auto;
  padding: 56px 32px 80px;
}

/* ─── Header ──────────────────────────────────────────────── */
.wordmark {
  font-family: var(--serif);
  font-size: 28px;
  font-weight: 900;
  letter-spacing: -0.6px;
  display: inline-flex;
  align-items: baseline;
}
.wordmark .dot { color: var(--accent); font-size: 32px; }

.eyebrow {
  font-family: var(--sans);
  font-size: 10px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 600;
  margin-top: 32px;
  margin-bottom: 16px;
}

h1.page-title {
  font-family: var(--serif);
  font-weight: 800;
  font-size: clamp(34px, 5.5vw, 52px);
  line-height: 1.04;
  letter-spacing: -1.2px;
  margin-bottom: 12px;
}
h1.page-title .italic {
  font-style: italic;
  font-weight: 500;
  color: var(--accent);
}

.page-sub {
  color: var(--muted);
  font-size: 16px;
  max-width: 540px;
  line-height: 1.55;
  margin-bottom: 40px;
}

/* ─── Section card ────────────────────────────────────────── */
.section {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  margin-bottom: 18px;
  overflow: hidden;
  transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
}
.section.locked {
  opacity: 0.45;
  pointer-events: none;
}
.section.locked .section-body { max-height: 0; padding-top: 0; padding-bottom: 0; opacity: 0; }
.section.active {
  border-color: var(--accent-line);
  box-shadow: 0 0 0 1px var(--accent-bg-strong), 0 24px 60px -32px rgba(0,0,0,0.4);
}
.section.done {
  opacity: 0.72;
}
.section.done .section-body { max-height: 0; padding-top: 0; padding-bottom: 0; opacity: 0; }
.section.done .section-header {
  border-bottom-color: transparent;
}

.section-header {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 22px 28px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  user-select: none;
}
.section.locked .section-header,
.section.done .section-header { cursor: default; }

.step-num {
  flex-shrink: 0;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--bg3);
  border: 1px solid var(--border-strong);
  color: var(--muted);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--serif);
  font-size: 15px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  transition: all 0.3s ease;
}
.section.active .step-num {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--bg);
}
.section.done .step-num {
  background: transparent;
  border-color: var(--success);
  color: var(--success);
}
.section.done .step-num::after {
  content: '✓';
  font-family: var(--sans);
  font-size: 16px;
}
.section.done .step-num span { display: none; }

.section-title-wrap { flex: 1; min-width: 0; }
.section-title {
  font-family: var(--serif);
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.3px;
  line-height: 1.2;
  margin-bottom: 2px;
}
.section-sub {
  font-size: 13px;
  color: var(--muted);
  line-height: 1.4;
}

.section-body {
  padding: 24px 28px 28px;
  max-height: 4000px;
  opacity: 1;
  transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1),
              opacity 0.3s ease,
              padding 0.3s ease;
  overflow: hidden;
}

/* ─── Deal summary card (Section 1) ───────────────────────── */
.deal-card {
  background: var(--bg3);
  border: 1px solid var(--border-2);
  border-radius: 10px;
  padding: 22px 24px;
  margin-bottom: 18px;
}
.deal-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;
  padding: 10px 0;
  border-bottom: 1px dashed var(--border);
}
.deal-row:last-child { border-bottom: none; padding-bottom: 0; }
.deal-row:first-child { padding-top: 0; }
.deal-label {
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--dim);
  font-weight: 600;
}
.deal-value {
  font-family: var(--serif);
  font-weight: 600;
  font-size: 17px;
  letter-spacing: -0.3px;
  color: var(--white);
  text-align: right;
}
.deal-value .accent { color: var(--accent); }
.deal-value .small { font-size: 12px; color: var(--muted); font-family: var(--sans); font-weight: 400; }
.deal-total {
  padding-top: 14px;
  margin-top: 4px;
  border-top: 1px solid var(--accent-line);
}
.deal-total .deal-value {
  font-size: 22px;
  color: var(--accent);
}

.body-text {
  color: var(--muted);
  font-size: 14px;
  line-height: 1.6;
  margin-bottom: 18px;
}
.body-text strong { color: var(--white); font-weight: 500; }

/* ─── Inputs ──────────────────────────────────────────────── */
.field {
  margin-bottom: 16px;
}
.field-label {
  display: block;
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--dim);
  font-weight: 600;
  margin-bottom: 7px;
}
.field-input,
.field-textarea {
  width: 100%;
  background: var(--bg3);
  border: 1px solid var(--border-strong);
  border-radius: 8px;
  color: var(--white);
  font-family: var(--sans);
  font-size: 14.5px;
  padding: 11px 14px;
  transition: border-color 0.15s ease;
}
.field-input:focus,
.field-textarea:focus {
  outline: none;
  border-color: var(--accent);
}
.field-input::placeholder { color: var(--faint); }
.field-textarea { resize: vertical; min-height: 80px; }

.field-hint {
  font-size: 12px;
  color: var(--muted);
  margin-top: 6px;
  line-height: 1.5;
}

/* ─── Password show/hide toggle ───────────────────────────────
   Wrapper sits relative so the eye button can absolute-position over the input
   right edge. Input gets right-padding so the user's typed password doesn't
   slide under the icon. Tap zone is 40×40 even though the icon is 18×18 — big
   thumbs on phones need real estate.
*/
.pw-input-wrap {
  position: relative;
}
.pw-input {
  padding-right: 48px; /* room for the eye button */
}
.pw-toggle {
  position: absolute;
  top: 50%;
  right: 4px;
  transform: translateY(-50%);
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: none;
  color: var(--muted);
  cursor: pointer;
  border-radius: 6px;
  padding: 0;
  transition: color 0.15s ease, background 0.15s ease;
}
.pw-toggle:hover {
  color: var(--accent);
  background: var(--accent-bg);
}
.pw-toggle:focus-visible {
  outline: none;
  color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-dim);
}
.pw-toggle.revealed {
  color: var(--accent);
}

/* ─── Venue row (for delegation entry) ───────────────────── */
.venue-rows { display: flex; flex-direction: column; gap: 12px; margin-bottom: 18px; }
.venue-row {
  background: var(--bg3);
  border: 1px solid var(--border-2);
  border-radius: 10px;
  padding: 16px 18px;
}
.venue-row-head {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}
.venue-row-num {
  flex-shrink: 0;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--accent-bg-strong);
  color: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--serif);
  font-size: 12px;
  font-weight: 700;
}
.venue-row-label {
  font-family: var(--serif);
  font-size: 15px;
  font-weight: 600;
  color: var(--white);
  letter-spacing: -0.2px;
}
.venue-row-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
@media (max-width: 540px) {
  .venue-row-grid { grid-template-columns: 1fr; }
}

/* ─── Live inbox preview inside venue-row ─── */
.inbox-preview {
  margin-top: 12px;
  font-family: 'SF Mono', 'Monaco', 'Courier New', monospace;
  font-size: 11.5px;
  line-height: 1.5;
  display: flex;
  align-items: baseline;
  gap: 8px;
  flex-wrap: wrap;
}
.inbox-preview-label {
  color: var(--dim);
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  font-weight: 500;
}
.inbox-preview-value {
  color: var(--accent);
  font-weight: 500;
  transition: color 0.15s ease;
}
.inbox-preview-value.empty {
  color: var(--dim);
  font-style: italic;
  font-family: var(--sans);
  font-size: 12px;
  font-weight: 400;
}
.inbox-preview-value.conflict {
  color: var(--danger);
  text-decoration: line-through;
  text-decoration-color: rgba(217,119,87,0.5);
}
.inbox-preview-warning {
  margin-top: 8px;
  padding: 8px 10px;
  background: var(--danger-bg);
  border-left: 2px solid var(--danger);
  border-radius: 4px;
  font-size: 12px;
  color: var(--danger);
  line-height: 1.45;
}

.inbox-display {
  background: var(--bg);
  border: 1px solid var(--border-2);
  border-radius: 8px;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 4px;
}
.inbox-address {
  font-family: 'SF Mono', 'Monaco', 'Courier New', monospace;
  font-size: 14px;
  color: var(--accent);
  font-weight: 500;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.copy-btn {
  flex-shrink: 0;
  background: transparent;
  border: 1px solid var(--border-strong);
  color: var(--muted);
  font-family: var(--sans);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.05em;
  padding: 7px 12px;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.15s ease;
}
.copy-btn:hover { border-color: var(--accent-dim); color: var(--accent); }
.copy-btn.copied { background: var(--success-bg); border-color: var(--success); color: var(--success); }

/* ─── Buttons ─────────────────────────────────────────────── */
.btn {
  font-family: var(--sans);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.02em;
  padding: 13px 22px;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.15s ease;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  border: 1px solid var(--border-strong);
  background: var(--card);
  color: var(--white);
}
.btn:hover:not(:disabled) {
  background: var(--card-hi);
  border-color: var(--accent-dim);
}
.btn-primary {
  background: var(--accent);
  color: var(--bg);
  border-color: var(--accent);
}
.btn-primary:hover:not(:disabled) {
  background: var(--accent-2);
  border-color: var(--accent-2);
}
.btn-primary:disabled,
.btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
.btn-block { width: 100%; justify-content: center; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }

/* ─── Walkthrough tabs ────────────────────────────────────── */
.wt-tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 18px;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
.wt-tab {
  background: transparent;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--muted);
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.02em;
  padding: 10px 14px;
  cursor: pointer;
  transition: all 0.15s ease;
  margin-bottom: -1px;
}
.wt-tab:hover { color: var(--white); }
.wt-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.wt-panel { display: none; }
.wt-panel.active { display: block; animation: fadeIn 0.25s ease; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: translateY(0); }
}
.wt-steps {
  list-style: none;
  counter-reset: walk;
}
.wt-steps li {
  counter-increment: walk;
  padding: 12px 0 12px 38px;
  position: relative;
  font-size: 14px;
  color: var(--muted);
  line-height: 1.55;
  border-bottom: 1px dashed var(--border);
}
.wt-steps li:last-child { border-bottom: none; }
.wt-steps li::before {
  content: counter(walk);
  position: absolute;
  left: 0;
  top: 13px;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--bg3);
  border: 1px solid var(--accent-line);
  color: var(--accent);
  font-family: var(--serif);
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}
.wt-steps li strong { color: var(--white); font-weight: 500; }
.wt-steps li code {
  font-family: 'SF Mono', 'Monaco', monospace;
  font-size: 12.5px;
  background: var(--bg3);
  padding: 2px 7px;
  border-radius: 4px;
  color: var(--accent);
  border: 1px solid var(--accent-line);
}

/* ─── Test submission state ───────────────────────────────── */
.test-state {
  background: var(--bg3);
  border: 1px solid var(--border-2);
  border-radius: 10px;
  padding: 20px 22px;
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 18px;
  min-height: 86px;
}
.test-icon {
  flex-shrink: 0;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--bg);
  border: 1px solid var(--border-strong);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--serif);
  font-size: 20px;
  color: var(--muted);
  transition: all 0.3s ease;
}
.test-state.running .test-icon {
  border-color: var(--accent);
  color: var(--accent);
  animation: spin 1.4s linear infinite;
}
.test-state.success .test-icon {
  background: var(--success-bg);
  border-color: var(--success);
  color: var(--success);
}
.test-state.success .test-icon::before { content: '✓'; }
.test-state.success .test-icon span { display: none; }
.test-content { flex: 1; }
.test-headline {
  font-family: var(--serif);
  font-size: 16px;
  font-weight: 600;
  color: var(--white);
  margin-bottom: 4px;
  letter-spacing: -0.2px;
}
.test-detail {
  font-size: 13px;
  color: var(--muted);
  line-height: 1.5;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ─── Dispatch confirmation (master flow) ─────────────────── */
.dispatch-summary {
  background: var(--success-bg);
  border: 1px solid rgba(109,181,138,0.35);
  border-left: 3px solid var(--success);
  border-radius: 10px;
  padding: 22px 24px;
  margin-bottom: 18px;
}
.dispatch-summary-eyebrow {
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--success);
  font-weight: 600;
  margin-bottom: 8px;
}
.dispatch-summary-title {
  font-family: var(--serif);
  font-size: 20px;
  font-weight: 700;
  color: var(--white);
  margin-bottom: 12px;
  letter-spacing: -0.3px;
}
.dispatch-list {
  list-style: none;
  margin-top: 14px;
}
.dispatch-list li {
  padding: 8px 0;
  font-size: 13.5px;
  color: var(--muted);
  border-top: 1px dashed var(--border);
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
}
.dispatch-list li:first-child { border-top: none; }
.dispatch-list .name { color: var(--white); font-weight: 500; }
.dispatch-list .email {
  font-family: 'SF Mono', 'Monaco', monospace;
  font-size: 12px;
  color: var(--accent);
}

/* ─── Final handoff (venue mode) ──────────────────────────── */
.handoff {
  text-align: center;
  padding: 40px 28px;
  background: linear-gradient(135deg, var(--accent-bg-strong), var(--accent-bg));
  border: 1px solid var(--accent-dim);
  border-radius: 14px;
  margin-top: 24px;
}
.handoff-eyebrow {
  font-size: 10px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 600;
  margin-bottom: 14px;
}
.handoff-title {
  font-family: var(--serif);
  font-size: 32px;
  font-weight: 800;
  letter-spacing: -0.8px;
  line-height: 1.1;
  margin-bottom: 12px;
}
.handoff-title .italic { font-style: italic; font-weight: 500; color: var(--accent); }
.handoff-sub {
  color: var(--muted);
  font-size: 15px;
  margin-bottom: 24px;
  max-width: 480px;
  margin-left: auto;
  margin-right: auto;
  line-height: 1.55;
}

/* ─── Mode picker (dev-only — choose which token to test) ─── */
.dev-banner {
  background: var(--warning-bg);
  border: 1px solid rgba(212,160,74,0.3);
  border-radius: 8px;
  padding: 10px 14px;
  margin-bottom: 24px;
  font-size: 12px;
  color: var(--warning);
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
}

/* Contextual dev preview — appears post-dispatch inside the master "Sent" card.
   Same warning palette as .dev-banner so it reads as "test mode plumbing",
   not production UI. Removed when the dev banner is stripped for production. */
.dev-followup {
  margin-top: 28px;
  padding: 14px 18px;
  background: var(--warning-bg);
  border: 1px dashed rgba(212,160,74,0.45);
  border-radius: 8px;
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
}
.dev-followup-label {
  font-size: 9px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--warning);
  font-weight: 700;
  flex-shrink: 0;
}
.dev-followup-text {
  flex: 1;
  font-size: 12.5px;
  color: var(--muted);
  line-height: 1.5;
  min-width: 200px;
}
.dev-followup-cta {
  background: transparent;
  border: 1px solid rgba(212,160,74,0.4);
  color: var(--warning);
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 11.5px;
  font-weight: 600;
  text-decoration: none;
  transition: all 0.15s ease;
}
.dev-followup-cta:hover {
  background: rgba(212,160,74,0.15);
  border-color: var(--warning);
}
.dev-banner-label {
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  font-size: 10px;
}

// Slug a venue name into a clean email local-part.
// "Bistro Ricco (Surry Hills)" → "bistroriccosurryhills"
// "Café 21 — St Kilda" → "cafe21stkilda"
// Lowercase, strip diacritics, drop anything that isn't a-z0-9, collapse.
function slugifyVenueName(name) {
  if (!name) return '';
  return name
    .normalize('NFD')              // split accented chars: é → e + ́
    .replace(/[\u0300-\u036f]/g, '') // drop the diacritic marks
    .toLowerCase()
    .replace(/[^a-z0-9]/g, '')     // keep only alphanumerics
    .slice(0, 40);                 // cap length so weird long names don't make ugly inboxes
}

// Re-evaluate every venue row's inbox preview + same-form collision warnings.
// Called on every keystroke in any venue-name field. Idempotent — safe to call
// as often as you want.
function refreshInboxPreviews() {
  const rows = Array.from(document.querySelectorAll('#venue-dispatch-rows .venue-row'));
  if (!rows.length) return;

  // First pass: compute the slug for each row.
  const slugs = rows.map(row => {
    const idx = row.dataset.venueIdx;
    const name = row.querySelector('.venue-name-input').value.trim();
    return { idx, name, slug: slugifyVenueName(name) };
  });

  // Find slugs that collide (appear more than once and are non-empty).
  const slugCounts = {};
  slugs.forEach(s => { if (s.slug) slugCounts[s.slug] = (slugCounts[s.slug] || 0) + 1; });

  // Second pass: update the preview value + warning for each row.
  slugs.forEach(({ idx, name, slug }) => {
    const valueEl = document.querySelector(`[data-inbox-value="${idx}"]`);
    const warnEl  = document.querySelector(`[data-inbox-warning="${idx}"]`);
    if (!valueEl) return;

    if (!slug) {
      // Empty name → soft placeholder
      valueEl.textContent = '— enter venue name above —';
      valueEl.classList.add('empty');
      valueEl.classList.remove('conflict');
      warnEl.style.display = 'none';
    } else if (slugCounts[slug] > 1) {
      // Collides with another row in this form → warn the user
      valueEl.textContent = `${slug}@inbound.hiretrial.com.au`;
      valueEl.classList.remove('empty');
      valueEl.classList.add('conflict');
      warnEl.style.display = '';
    } else {
      // Clean preview
      valueEl.textContent = `${slug}@inbound.hiretrial.com.au`;
      valueEl.classList.remove('empty', 'conflict');
      warnEl.style.display = 'none';
    }
  });
}

function masterDoneBody() {

/* ───────────────────────────────────────────────────────────
   Section state machine — which section is active, which are done
   ─────────────────────────────────────────────────────────── */
function setActiveSection() {
  const sections = Array.from(document.querySelectorAll('.section'));
  if (!sections.length) return;

  const completedKeys = getCompletedKeys();
  sections.forEach(s => {
    s.classList.remove('locked', 'active', 'done');
    if (completedKeys.includes(s.dataset.section)) {
      s.classList.add('done');
    }
  });

  // First non-done section becomes active
  const firstUndone = sections.find(s => !s.classList.contains('done'));
  if (firstUndone) firstUndone.classList.add('active');
  else {
    // All sections done — for venue mode, redirect; for master mode, show summary
    handleAllDone();
  }

  // Lock everything after the active one
  let pastActive = false;
  sections.forEach(s => {
    if (pastActive) s.classList.add('locked');
    if (s.classList.contains('active')) pastActive = true;
  });

  wireBody();
  // Re-render dispatch list if we're in master mode and dispatch is done
  if (session.type === 'master' && progress.dispatchedAt) {
    renderDispatchList();
  }
}

function getCompletedKeys() {
  if (!session) return [];
  const done = [];
  if (session.type === 'master') {
    if (progress.paid) done.push('confirm');
    if (session.venueCount > 1) {
      if (progress.dispatchedAt) done.push('dispatch');
    } else {
      if (progress.plugged) done.push('plug');
      if (progress.tested) done.push('test');
      if (progress.passwordSet) done.push('password');
    }
  } else if (session.type === 'venue') {
    if (progress.namedVenue) done.push('name');
    if (progress.plugged) done.push('plug');
    if (progress.tested) done.push('test');
    if (progress.passwordSet) done.push('password');
  }
  return done;
}

/* ───────────────────────────────────────────────────────────
   Wire body — attach event handlers to whatever's currently rendered.
   Called after each render + state transition.
   ─────────────────────────────────────────────────────────── */
function wireBody() {
  // Walkthrough tabs (Plug section)
  document.querySelectorAll('.wt-tab').forEach(t => {
    t.onclick = () => {
      const key = t.dataset.wt;
      t.parentElement.querySelectorAll('.wt-tab').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      const card = t.closest('.section-body');
      card.querySelectorAll('.wt-panel').forEach(p => p.classList.toggle('active', p.dataset.wtPanel === key));
    };
  });

  // Pay button (master mode)
  const payBtn = $('pay-btn');
  if (payBtn) payBtn.onclick = onPayClick;

  // Dispatch button (master multi-venue)
  const dispatchBtn = $('dispatch-btn');
  if (dispatchBtn) dispatchBtn.onclick = onDispatchClick;

  // Live inbox preview — every keystroke in any venue-name input recomputes
  // all previews + collision warnings. Listener attached to each input so
  // it survives section state transitions.
  document.querySelectorAll('.venue-name-input').forEach(input => {
    input.addEventListener('input', refreshInboxPreviews);
  });

  // Venue name confirm (venue mode)
  const confirmNameBtn = $('confirm-name-btn');
  if (confirmNameBtn) confirmNameBtn.onclick = onConfirmNameClick;

  // Plug done button
  const plugDoneBtn = $('plug-done-btn');
  if (plugDoneBtn) plugDoneBtn.onclick = onPlugDoneClick;

  // Run test button
  const runTestBtn = $('run-test-btn');
  if (runTestBtn) runTestBtn.onclick = onRunTestClick;

  // Finish (set password)
  const finishBtn = $('finish-btn');
  if (finishBtn) finishBtn.onclick = onFinishClick;

  // Password show/hide toggles — per-field, stays revealed until tapped again
  document.querySelectorAll('.pw-toggle').forEach(btn => {
    btn.onclick = (e) => {
      e.preventDefault();
      const targetId = btn.dataset.pwToggle;
      const input = document.getElementById(targetId);
      if (!input) return;
      const revealed = input.type === 'text';
      if (revealed) {
        input.type = 'password';
        btn.innerHTML = EYE_SVG_OPEN;
        btn.classList.remove('revealed');
        btn.setAttribute('aria-label', 'Show password');
        btn.setAttribute('title', 'Show password');
      } else {
        input.type = 'text';
        btn.innerHTML = EYE_SVG_CLOSED;
        btn.classList.add('revealed');
        btn.setAttribute('aria-label', 'Hide password');
        btn.setAttribute('title', 'Hide password');
      }
    };
  });
}

function wireSectionToggles() {
  // Section headers — clicking a done section lets you peek at it but not edit.
  // Active and locked sections don't toggle.
  document.querySelectorAll('.section.done .section-header').forEach(h => {
    h.onclick = () => {
      const section = h.closest('.section');
      section.classList.toggle('expand-peek');
      const body = section.querySelector('.section-body');
      if (section.classList.contains('expand-peek')) {
        body.style.maxHeight = '4000px';
        body.style.opacity = '0.6';
        body.style.padding = '24px 28px 28px';
      } else {
        body.style.maxHeight = '0';
        body.style.opacity = '0';
        body.style.padding = '0 28px';
      }
    };
  });
}

function onDispatchClick() {
  // Validate every venue has a name + email
  const rows = Array.from(document.querySelectorAll('#venue-dispatch-rows .venue-row'));
  const data = [];
  let allValid = true;
  const slugs = []; // collected so we can detect same-form collisions

  rows.forEach(row => {
    const idx = parseInt(row.dataset.venueIdx, 10);
    const name = row.querySelector('.venue-name-input').value.trim();
    const email = row.querySelector('.venue-email-input').value.trim();
    const slug = slugifyVenueName(name);
    if (!name || !email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      row.style.borderColor = 'var(--danger)';
      allValid = false;
    } else {
      row.style.borderColor = '';
      data.push({ idx, name, email, previewedInbox: `${slug}@inbound.hiretrial.com.au` });
      slugs.push(slug);
    }
  });

  if (!allValid) {
    showToast("Please name every venue and give a valid manager email.");
    return;
  }

  // Block dispatch if any two venues in this form would resolve to the same inbox.
  // The user has already seen the per-row warning; this is the final gate.
  const slugSet = new Set(slugs);
  if (slugSet.size !== slugs.length) {
    showToast("Two venues have names that conflict — make them more specific before dispatching.");
    return;
  }

  const btn = $('dispatch-btn');
  btn.disabled = true;
  btn.textContent = 'Sending setup links…';
  // PRODUCTION:
  // await fetch('/api/setup/dispatch/' + getToken(), {
  //   method: 'POST',
  //   headers: { 'Content-Type': 'application/json' },
  //   body: JSON.stringify({ venues: data })
  // });
  // Backend slugifies the name, handles cross-customer collisions (suffix with
  // business slug if needed), creates the venue rows + setup_tokens, and sends
  // the manager emails via Resend. Returns the final inboxes so we can confirm.
  setTimeout(() => {
    progress.dispatchedAt = new Date().toISOString();
    progress.dispatchedTo = data;
    saveProgress();
    showToast(`Sent ${data.length} setup links. Check ${session.groupOwnerEmail} for a copy.`, 3500);
    setActiveSection();
  }, 1600);
}

function renderDispatchList() {
  const list = $('dispatch-list');
  if (!list) return;
  const items = (progress.dispatchedTo || []).map(d => `
    <li>
      <span><span class="name">${escapeHtml(d.name)}</span> · venue ${d.idx}</span>
      <span class="email">${escapeHtml(d.email)}</span>
    </li>`).join('');
  list.innerHTML = items;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function onFinishClick() {
  // Validate business email — this is the login address, not the forwarding inbox
  const email = ($('login-email')?.value || '').trim();
  const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if (!email || !emailRe.test(email)) {
    showToast("Enter a valid business email — this is what you'll log in with.");
    $('login-email')?.focus();
    return;
  }

  const pw1 = $('pw1').value;
  const pw2 = $('pw2').value;
  if (pw1.length < 8) {
    showToast("Password needs to be at least 8 characters.");
    return;
  }
  if (pw1 !== pw2) {
    showToast("Passwords don't match — try again.");
    return;
  }

  progress.loginEmail = email;

  const btn = $('finish-btn');
  btn.disabled = true;
  btn.textContent = 'Setting up your dashboard…';

  try {
    console.log('[setup-complete] Calling Edge Function…');
    // Call our Edge Function to create the Auth user + users row + mark venue complete.
    const res = await fetch(`${SUPABASE_URL}/functions/v1/setup-complete`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
        'apikey': SUPABASE_ANON_KEY
      },
      body: JSON.stringify({
        token: getToken(),
        email,
        password: pw1,
        full_name: session.managerName || session.groupOwnerName || ''
      })
    });

    const data = await res.json();
    console.log('[setup-complete] Response:', res.status, data);

    if (!res.ok || !data.ok) {
      btn.disabled = false;
      btn.textContent = 'Set password & open dashboard →';
      showToast(data.error || "Something went wrong. Please try again.");
      return;
    }

    // Auth user exists now — sign them in client-side to mint a session.
    const { error: signInErr } = await window.trialSupabase.auth.signInWithPassword({
      email,
      password: pw1
    });

    if (signInErr) {
      console.error('[setup-complete] Post-setup signIn failed:', signInErr);
    }

    progress.passwordSet = true;
    saveProgress();
    setActiveSection();

  } catch (err) {
    console.error('[setup-complete] Fetch failed:', err);
    btn.disabled = false;
    btn.textContent = 'Set password & open dashboard →';
    showToast("Network error — please try again.");
  }
}

function copyInbox(email, btn) {
  navigator.clipboard.writeText(email).then(() => {
    btn.textContent = 'Copied';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = 'Copy';
      btn.classList.remove('copied');
    }, 1500);
  }).catch(() => {
    showToast("Couldn't copy — try selecting it manually.");
  });
}

/* ═══════════════════════════════════════════════════════════════

function highlightCurrentScenario() {
  // In production (no ?dev=1), the dev banner stays hidden. Real users never see it.
  if (!isDevMode()) return;

  const banner = document.getElementById('dev-banner');
  if (!banner) return;
  banner.style.display = ''; // reveal — default flex from CSS

  const token = getToken();
  // Master flows: just highlight which one is current
  if (session && session.type === 'master') {
    banner.querySelectorAll('a').forEach(a => {
      const url = new URL(a.href);
      if (url.searchParams.get('token') === token) a.classList.add('current');
    });
    wireResetButton();
    return;
  }
  // Venue (delegated) flow: replace the dev banner content to reflect that
  // we're now seeing what the manager sees, with a way back to master flow.
  // Preserve ?dev=1 in the back link so we stay in dev mode after the pivot.
  if (session && session.type === 'venue') {
    banner.innerHTML = `
      <span class="dev-banner-label">Dev preview</span>
      <span style="color:var(--muted);font-size:11.5px;flex:1;">
        You're previewing what a venue manager sees after their group owner dispatched setup links.
      </span>
      <div class="dev-banner-links">
        <a href="?token=master_starter&dev=1">&larr; Back to master setup</a>
      </div>
      <button class="dev-banner-reset" id="dev-reset-btn" type="button">Reset progress</button>
    `;
    wireResetButton();
  }
}

// Wipe all trial-setup-* keys from localStorage so any scenario can be re-walked
// from scratch. Bound to #dev-reset-btn each time it appears in the DOM (banner
// gets re-rendered in venue mode, so we rebind after every render).
function wireResetButton() {
  const btn = document.getElementById('dev-reset-btn');
  if (!btn) return;
  btn.addEventListener('click', () => {
    if (!confirm('Wipe all setup progress and reload? This clears every test flow on this device.')) return;
    Object.keys(localStorage)
      .filter(k => k.startsWith('trial-setup-'))
      .forEach(k => localStorage.removeItem(k));
    // Reload to current URL — keeps ?dev=1 + token so you stay in the same scenario, fresh.
    location.reload();
  });
}

/* ═══════════════════════════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════════════════════════ */
(async () => {
  const token = getToken();
  session = await resolveToken(token);
  progress = loadProgress(token);
  highlightCurrentScenario();
  renderApp();
})();
</script>
